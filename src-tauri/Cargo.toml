[package]
name = "holodori-desktop"
version = "1.3.1"
edition = "2021"
description = "Hololive Dreams Planner for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
regex = "1"
rfd = "0.15"
zip = { version = "4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true
