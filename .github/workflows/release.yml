name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish release assets
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          $blockmap = Get-ChildItem release -Filter '*.blockmap' | Select-Object -First 1
          $metadata = Get-Item release/latest.yml
          if (-not $installer -or -not $blockmap -or -not $metadata) { throw 'electron-builder did not produce every update asset' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $blockmap.FullName $metadata.FullName --verify-tag --title "holodori Planner $env:GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run smoke
